<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #4cd137;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .delete-btn {
            background: red;
            color: white;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>📝 Task Manager</h1>

    <input id="taskInput" placeholder="Enter a task..." />
    <button onclick="addTask()">Add</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="taskTable"></tbody>
    </table>
</div>

<script>
    async function addTask() {
        const input = document.getElementById("taskInput");
        const title = input.value;

        if (!title) return;

        await fetch("/tasks", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ title })
        });

        input.value = "";
        loadTasks();
    }

    async function deleteTask(id) {
        await fetch(`/tasks/${id}`, {
            method: "DELETE"
        });

        loadTasks();
    }

    async function loadTasks() {
        const res = await fetch("/tasks");
        const data = await res.json();

        const table = document.getElementById("taskTable");
        table.innerHTML = "";

        data.forEach(task => {
            const row = `
                <tr>
                    <td>${task.id}</td>
                    <td>${task.title}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                    </td>
                </tr>
            `;
            table.innerHTML += row;
        });
    }

    loadTasks();
</script>

</body>
</html>
