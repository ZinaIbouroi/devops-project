name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install -r requirements.txt 

      - name: Run tests
        run: pytest

      - name: Security scan
        run: pip-audit

      - name: Build Docker image
        run: docker build -t devops-app .

      - name: Run container
        run: docker run -d -p 5000:5000 -e APP_MESSAGE="Hello CI 🚀" --name test-container devops-app

      - name: Wait for app
        run: sleep 5

      - name: Test API
        run: |
          curl -f http://localhost:5000
          curl -f http://localhost:5000/health
